<!-- NOTE: A CSS scale attribute is added to all the mailings 
 to properly display them within each widget container. The copy
 functionality still copies the original code. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script src="code-snippets.js" defer></script>
    <title>Slated</title>
  </head>
  <body>
    <div class="navbar">
      <a href="index.html" class="nav-page-links">Home</a>
      <a href="widget.html" class="nav-page-links">Widget</a>
      <a href="mailings.html" class="nav-page-links active">Mailing</a>
    </div>

    <div class="main-container-grid" id="grid-mailings">

      <template id="template-mailing-card">
        <section class="card-container mailing-container">

          <section class="description mailing">
            <section class="template-information mailing">
              <h2></h2>
            </section>
          </section>

          <section class="demo mailing">
            <iframe class="mailing"></iframe>
          </section>

          <section class="code-container mailing">
            <section class="code-snippet mailing">
              <pre><code class="language-html"></code></pre>
            </section>
            <section class="code-snippet-copy mailing">
              <button class="zoom-btn mailing">Zoom</button>
              <button class="copy-btn mailing" onclick="copyHidden(this)">Copy</button>
              <code class="hidden-code"></code>
            </section>
          </section>

        </section>
      </template>
    </div>

    <!-- Dialog box for code snippet zoom-->

    <dialog class="snippet-modal">
              <pre><code class="language-html modal-code"></code></pre>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  </body>
</html>
