<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="code-snippets.js" defer></script>
    <title>HH Form of Codes</title>
  </head>
  <body>
    <h1>HH Form of Codes</h1> 
    <section id="main-container">
      <div class="widget-container">
        <section class="widget-element">
          <p
            style="
              padding: 6px 10px;    
              background-color: #002d6a;
              color: #ffffff;
              font-size: 15px;
              border-radius: 6px;
            "
          >
            <b>Student Information</b>
          </p>
        </section>
        <section class="widget-code-snippet">
          <button class="copy-btn" data-snippet="snippet1">Copy</button>
          <code>
            <p>Student Name: John Doe</p>
            <p>Student ID: 123456</p>
            <p>Course: Computer Science</p>
          </code>
          
        </section>
      </div>
      <div class="widget-container">
        <p
            style="
              background-color: rgb(249, 146, 57);
              color: #ffffff;
              font-size: 14px;
              padding: 6px;
              border-radius: 6px;
              font-weight: bold;
            "
          >
            Staff Use Only:
          </p>
      </div>
      <div class="widget-container">
        <p>
          This is widget 3. It contains some code snippets and a copy button.
        </p>
      </div>
      <div class="widget-container">
        <p>
          This is widget 4. It contains some code snippets and a copy button.
        </p>
      </div>
    </section>
  </body>
</html>
